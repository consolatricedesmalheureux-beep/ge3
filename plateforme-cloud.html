<style>
:root{
  --vert:#1a4731; --vert2:#2d7a5c; --or:#c9972c; --or2:#e8b84b;
  --rouge:#a23a2e; --bleu:#1a5fb4; --gris:#6b6b6b;
  --bg:#f4f6f5; --card:#ffffff; --txt:#1c2b22; --muted:#7a857e; --bord:#e2e8e4;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0 0 .4em;color:var(--vert)}
a{color:var(--bleu)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
.hidden{display:none!important}

/* Boutons */
.btn{background:var(--vert);color:#fff;border:none;padding:11px 18px;border-radius:10px;font-weight:600;font-size:14px}
.btn:hover{background:#123322}
.btn.gold{background:var(--or);color:#1a2e1f}.btn.gold:hover{background:#b3861f}
.btn.ghost{background:#eef2ef;color:var(--vert)}.btn.ghost:hover{background:#dfe7e2}
.btn.danger{background:var(--rouge);color:#fff}
.btn.sm{padding:7px 12px;font-size:12.5px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Champs */
.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--vert);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.6px solid var(--bord);border-radius:9px;background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--or)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}}

/* Cartes */
.card{background:var(--card);border:1px solid var(--bord);border-radius:14px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{font-size:16px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;color:#fff;letter-spacing:.3px}
.tag.v{background:var(--vert)}.tag.g{background:var(--or);color:#1a2e1f}.tag.b{background:var(--bleu)}
.tag.r{background:var(--rouge)}.tag.m{background:var(--gris)}

/* Tables */
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
table.tbl th,table.tbl td{border:1px solid var(--bord);padding:8px 10px;text-align:left}
table.tbl th{background:#f0f4f1;color:var(--vert);font-weight:700}
table.tbl tr:nth-child(even) td{background:#fafbfa}
.tbl-wrap{overflow-x:auto}

/* Login */
#screen-login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--vert) 0%,#0d2818 100%);padding:20px}
.login-box{background:#fff;border-radius:18px;padding:36px 30px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.login-logo{font-size:44px;text-align:center}
.login-img{display:block;margin:0 auto 10px;width:96px;height:96px;object-fit:contain;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.login-box h1{text-align:center;font-size:21px;margin:6px 0 2px}
.login-box .sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:22px}
.msg{min-height:18px;font-size:12.5px;font-weight:700;color:var(--rouge);text-align:center;margin:8px 0}
.msg.ok{color:var(--vert2)}

/* App shell */
.appbar{background:var(--vert);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:50}
.appbar .brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.appbar .who{font-size:12px;text-align:right;line-height:1.35;opacity:.95}
.appbar .who b{color:var(--or2)}
.appbar .actions{display:flex;gap:8px;align-items:center}
.wrap{max-width:1080px;margin:0 auto;padding:18px}
.subnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.subnav button{background:#fff;border:1.5px solid var(--bord);color:var(--vert);padding:9px 15px;border-radius:10px;font-weight:600;font-size:13.5px}
.subnav button.active{background:var(--vert);color:#fff;border-color:var(--vert)}

/* Stat tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--bord);border-left:5px solid var(--or);border-radius:12px;padding:14px 16px}
.tile .n{font-size:26px;font-weight:800;color:var(--vert)}
.tile .l{font-size:12px;color:var(--muted);font-weight:600}

/* Élève cards */
.eleves-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.eleve-card{background:#fff;border:1px solid var(--bord);border-radius:12px;padding:12px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:.12s}
.eleve-card:hover{border-color:var(--or);box-shadow:0 4px 14px rgba(201,151,44,.18)}
.eleve-photo{width:52px;height:52px;border-radius:10px;object-fit:cover;background:#e8ede9;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;color:#9aa8a0}
.eleve-card .en{font-weight:700;font-size:14px}
.eleve-card .em{font-size:12px;color:var(--muted)}

/* Fiche élève */
.hub-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hub-photo{width:84px;height:84px;border-radius:14px;object-fit:cover;background:#e8ede9;display:flex;align-items:center;justify-content:center;font-size:36px;color:#9aa8a0}
.pill{display:inline-block;background:#eef2ef;color:var(--vert);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
.gate{background:#fff8e6;border:1.5px solid var(--or2);border-radius:12px;padding:18px;text-align:center}
.credbox{background:#f0f4f1;border:1px dashed var(--vert2);border-radius:10px;padding:12px;margin-top:10px;font-family:monospace;font-size:13px}
.g{color:var(--vert2)} .muted{color:var(--muted)}
#printall{display:none}
@media print{.appbar,.subnav,.no-print{display:none!important}}
@media print{body.printing-all>*:not(#printall){display:none!important}
  body.printing-all #printall{display:block!important}
  body.printing-all .bull-page{page-break-after:always}
  body.printing-all .cartes-grid{display:flex;flex-wrap:wrap;gap:12px}
  body.printing-all .carte-cell{width:48%;page-break-inside:avoid}}
</style>
</head>

<script>
/* ════════════════════════════════════════════════════════════════

(function(){

var KEY='ge_v4';
var TYPES_EVAL=['Diagnostique','Formative','Sommative',"Étape",'Certificative'];
var NIVEAUX=['Ma1','Ma2','Ma3','CI','CP','CE1','CE2','CM1','CM2'];

/* ---------- Base de données unique ---------- */
function fresh(){return{
  meta:{version:1, annee:anneeDefaut()},
  ministere:{nom:"Ministère des Enseignements Maternel et Primaire"},

};}

function uid(p){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():(p+'-'+Date.now()+'-'+Math.random());}
function emailDe(ident){return String(ident).indexOf('@')>=0?ident:ident.toLowerCase()+'@ge3.bj';}

/* ---------- Persistance cloud : upsert/suppression ---------- */
function sbSave(table,row){return sb.from(table).upsert(row).then(function(r){if(r.error)console.warn('save '+table,r.error.message);return r;});}
function sbDel(table,match){return sb.from(table).delete().match(match).then(function(r){if(r.error)console.warn('del '+table,r.error.message);return r;});}
/* mappages mémoire → ligne SQL */
function ecoleRow(e){return{id:e.id,nom:e.nom,statut:e.statut,commune:e.commune,zone:e.zone,cs_id:e.csId||null,ddemp_id:e.ddempId||null,classes_autorisees:e.classesAutorisees,directeur_nom:e.directeurNom,annee:e.annee};}
function eleveRow(e){return{id:e.id,ecole_id:e.ecoleId||null,classe:e.classe,annee:e.annee,nom:e.nom,prenom:e.prenom,sexe:e.sexe,date_n:e.dateN,lieu_n:e.lieuN,matricule:e.matricule,pere:e.pere,mere:e.mere,tel:e.tel,photo:e.photo};}
function evalRow(v){return{id:v.id,ecole_id:v.ecoleId||null,classe:v.classe,annee:v.annee,type:v.type,numero:v.numero,seuil:v.seuil,matieres:v.matieres};}
function annonceRow(a){return{id:a.id,ecole_id:a.ecoleId||null,titre:a.titre,texte:a.texte,date:a.date,auteur:a.auteur};}

/* ---------- Chargement initial depuis le cloud ---------- */
function loadAll(){
  DB=fresh();DB.users=[];
  return Promise.all([
    sb.from('ddemps').select('*'), sb.from('cs').select('*'), sb.from('cps').select('*'),
    sb.from('ecoles').select('*'), sb.from('profiles').select('*'),
    sb.from('eleves').select('*'), sb.from('evaluations').select('*'),
    sb.from('notes').select('*'), sb.from('cantine').select('*'),
    sb.from('presences').select('*'), sb.from('examen_blanc').select('*'),
    sb.from('mensuel').select('*'), sb.from('annonces').select('*')
  ]).then(function(res){
    var d=res.map(function(r){return r.data||[];});
    DB.ddemps=d[0].map(function(x){return{id:x.id,nom:x.nom,respNom:x.sis_nom,respPrenom:x.sis_prenom};});
    DB.cs=d[1].map(function(x){return{id:x.id,nom:x.nom,ddempId:x.ddemp_id,sisNom:x.ccs_nom,sisPrenom:x.ccs_prenom};});
    DB.cps=d[2].map(function(x){return{id:x.id,nom:x.nom,prenom:x.prenom,zone:x.zone,csId:x.cs_id,ddempId:x.ddemp_id};});
    DB.ecoles=d[3].map(function(x){return{id:x.id,nom:x.nom,statut:x.statut,commune:x.commune,zone:x.zone,csId:x.cs_id,ddempId:x.ddemp_id,classesAutorisees:x.classes_autorisees,directeurNom:x.directeur_nom,annee:x.annee};});
    DB.users=d[4].map(function(x){return{id:x.id,role:x.role,nom:x.nom,prenom:x.prenom,ecoleId:x.ecole_id,csId:x.cs_id,ddempId:x.ddemp_id,classe:x.classe,actif:x.actif,matricule:x.email||x.id};});
    DB.eleves=d[5].map(function(x){return{id:x.id,ecoleId:x.ecole_id,classe:x.classe,annee:x.annee,nom:x.nom,prenom:x.prenom,sexe:x.sexe,dateN:x.date_n,lieuN:x.lieu_n,matricule:x.matricule,pere:x.pere,mere:x.mere,tel:x.tel,photo:x.photo};});
    DB.evaluations=d[6].map(function(x){return{id:x.id,ecoleId:x.ecole_id,classe:x.classe,annee:x.annee,type:x.type,numero:x.numero,seuil:x.seuil,matieres:x.matieres||[]};});
    DB.notes={};d[7].forEach(function(n){DB.notes[n.evaluation_id]=DB.notes[n.evaluation_id]||{};DB.notes[n.evaluation_id][n.eleve_id]=DB.notes[n.evaluation_id][n.eleve_id]||{};DB.notes[n.evaluation_id][n.eleve_id][n.matiere]=n.valeur;});
    DB.cantine={};d[8].forEach(function(c){DB.cantine[c.eleve_id]={tarif:c.tarif,jours:c.jours};});
    DB.presences={};d[9].forEach(function(p){DB.presences[p.eleve_id]={present:p.present,absent:p.absent};});
    DB.examenBlanc={};d[10].forEach(function(x){DB.examenBlanc[x.eleve_id]=DB.examenBlanc[x.eleve_id]||{};DB.examenBlanc[x.eleve_id][x.epreuve]=x.note;});
    DB.mensuel={};d[11].forEach(function(m){DB.mensuel[m.eleve_id]=DB.mensuel[m.eleve_id]||{};DB.mensuel[m.eleve_id][m.mois]=m.note;});
    DB.annonces=d[12].map(function(a){return{id:a.id,ecoleId:a.ecole_id,titre:a.titre,texte:a.texte,date:a.date,auteur:a.auteur};});
    if(SESSION){var me=DB.users.find(function(u){return u.id===SESSION.id;});if(me){SESSION.role=me.role;SESSION.ecoleId=me.ecoleId;SESSION.csId=me.csId;SESSION.ddempId=me.ddempId;SESSION.classe=me.classe;SESSION.nom=me.nom;SESSION.prenom=me.prenom;}}
    // année courante : celle de la dernière école connue, sinon défaut
    if(DB.ecoles.length&&DB.ecoles[0].annee)DB.meta.annee=DB.ecoles[0].annee;
    save();
  });
}
function anneeDefaut(){var d=new Date(),y=d.getFullYear();return d.getMonth()>=8?y+'-'+(y+1):(y-1)+'-'+y;}
function motDePasseTemp(){return 'GE'+Math.floor(1000+Math.random()*9000);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- Session ---------- */
var SESSION=null;
function setSession(u){SESSION=u;}

/* ---------- Helpers hiérarchie ---------- */
function ecoleOf(id){return DB.ecoles.find(function(e){return e.id===id;});}
function csOf(id){return DB.cs.find(function(c){return c.id===id;});}
function ddempOf(id){return DB.ddemps.find(function(d){return d.id===id;});}
function elevesDe(ecoleId,classe){return DB.eleves.filter(function(e){return e.ecoleId===ecoleId&&(!classe||e.classe===classe)&&e.annee===DB.meta.annee;});}
function ecolesDeCS(csId){return DB.ecoles.filter(function(e){return e.csId===csId;});}
function ddempIdOfEcole(e){var c=e&&e.csId?csOf(e.csId):null;return c&&c.ddempId?c.ddempId:(e?e.ddempId:null);}
function ecolesDeDDEMP(dId){return DB.ecoles.filter(function(e){return ddempIdOfEcole(e)===dId;});}
function ensDeEcole(ecoleId){return DB.users.filter(function(u){return u.role==='ens'&&u.ecoleId===ecoleId;});}

/* ════════════════ CONNEXION ════════════════ */
window.doLogin=function(){
  var id=(qs('#in-login').value||'').trim();
  var pw=(qs('#in-pass').value||'').trim();
  var m=qs('#login-msg');
  if(!id||!pw){m.textContent="Renseignez l'identifiant et le mot de passe.";return;}
  m.textContent="Connexion…";
  sb.auth.signInWithPassword({email:emailDe(id),password:pw}).then(function(r){
    if(r.error){m.textContent="Identifiant ou mot de passe incorrect.";return;}
    var au=r.data.user;
    SESSION={id:au.id,matricule:au.email};
    qs('#in-pass').value='';m.textContent="Chargement des données…";
    loadAll().then(function(){
      var me=DB.users.find(function(u){return u.id===au.id;});
      if(!me){m.textContent="Profil introuvable. Contactez l'administrateur.";return;}
      Object.assign(SESSION,me);
      m.textContent='';enterApp();
    }).catch(function(e){m.textContent="Erreur de chargement : "+(e.message||e);});
  });
};
function showChpass(){hide('#screen-login');hide('#screen-app');show('#screen-chpass');}
window.doChpass=function(){
  var a=qs('#cp-1').value,b=qs('#cp-2').value,m=qs('#cp-msg');
  if(a.length<6){m.textContent="Au moins 6 caractères.";return;}
  if(a!==b){m.textContent="Les deux mots de passe diffèrent.";return;}
  m.textContent="Enregistrement…";
  sb.auth.updateUser({password:a}).then(function(r){
    if(r.error){m.textContent=r.error.message;return;}
    hide('#screen-chpass');enterApp();
  });
};
window.logout=function(){sb.auth.signOut();setSession(null);hide('#screen-app');hide('#screen-chpass');show('#screen-login');qs('#in-login').value='';qs('#in-pass').value='';qs('#login-msg').textContent='';};

  else if(r==='cs')    NAV={dash:['📊 Circonscription Scolaire',renderCSDash]};

  var nav=qs('#subnav');nav.innerHTML='';

    var b=document.createElement('button');b.textContent=NAV[k][0];b.onclick=function(){go(k);};b.dataset.k=k;nav.appendChild(b);

function go(k){curNav=k;qsa('#subnav button').forEach(function(b){b.classList.toggle('active',b.dataset.k===k);});NAV[k][1](qs('#view'));}

/* ── Sauvegarde / Import-Export de la base ── */
function renderBackup(){
  var stats=[['DDEMP',DB.ddemps.length],['Circonscriptions',DB.cs.length],['Écoles',DB.ecoles.length],['Comptes',DB.users.length],['Élèves',DB.eleves.length]];

/* ── Clôture d'année & passage de classe ── */
function nextNiveau(classe){var i=NIVEAUX.indexOf(classe);if(i<0)return null;return i+1<NIVEAUX.length?NIVEAUX[i+1]:null;}
function nextAnnee(a){var m=String(a).match(/(\d{4})\D+(\d{4})/);if(!m)return a;return (+m[1]+1)+'-'+(+m[2]+1);}
function passageDecision(e){var moy=moyAnnOf(e.ecoleId,e.classe,e.id);
  if(moy==null)return{moy:null,decision:'Non évalué',nouvelle:e.classe,statut:'maintien'};
  if(moy>=10){var nv=nextNiveau(e.classe);
    if(nv==null)return{moy:moy,decision:'Admis (fin de cycle)',nouvelle:'—',statut:'sortie'};
    return{moy:moy,decision:'Admis (passe)',nouvelle:nv,statut:'passe'};}
  return{moy:moy,decision:'Redouble',nouvelle:e.classe,statut:'redouble'};}
function renderPassage(){
  var an=DB.meta.annee,nan=nextAnnee(an);
  var eleves=DB.eleves.filter(function(e){return e.annee===an&&!e.sorti;});
  var np=0,nr=0,ns=0,nm=0;
  eleves.forEach(function(e){var d=passageDecision(e);if(d.statut==='passe')np++;else if(d.statut==='redouble')nr++;else if(d.statut==='sortie')ns++;else nm++;});
  var head=card("Clôture de l'année scolaire "+esc(an),
    '<p class="muted" style="font-size:13px">Cette opération archive les résultats de <b>'+esc(an)+'</b> dans l\'historique de chaque élève, fait <b>passer</b> les admis en classe supérieure, <b>maintient</b> les redoublants, sort les CM2 admis, puis ouvre la nouvelle année <b>'+esc(nan)+'</b>.</p>'+
    tiles([['Élèves concernés',eleves.length],['Passent',np],['Redoublent',nr],['Fin de cycle',ns],['Non évalués',nm]])+
    (eleves.length?'<div class="msg" style="text-align:left">⚠️ Action irréversible. Vérifiez le tableau ci-dessous avant de confirmer.</div>'+
      '<button class="btn" onclick="doPassage()">🎓 Clôturer '+esc(an)+' et passer à '+esc(nan)+'</button> '+
      '<button class="btn gold sm" onclick="exportPassageCSV()">⬇️ Exporter l\'aperçu (CSV)</button>'
      :'<p class="muted">Aucun élève à traiter pour l\'année en cours.</p>'));
  if(!eleves.length)return head;
  var rows=eleves.map(function(e){var d=passageDecision(e);var ec=ecoleOf(e.ecoleId);
    var col=d.statut==='passe'?'var(--vert2)':d.statut==='redouble'?'var(--rouge)':d.statut==='sortie'?'var(--or)':'var(--muted)';
    return[esc(e.nom+' '+e.prenom),esc(ec?ec.nom:''),esc(e.classe),d.moy!=null?d.moy.toFixed(2):'—',
      '<span style="color:'+col+';font-weight:600">'+d.decision+'</span>',esc(d.nouvelle)];});
  return head+card("Aperçu du passage — "+esc(an)+' → '+esc(nan),
    tbl(['Élève','École','Classe '+an,'Moyenne/20','Décision','Classe '+nan],rows));
}
window.exportPassageCSV=function(){var an=DB.meta.annee,nan=nextAnnee(an);
  var eleves=DB.eleves.filter(function(e){return e.annee===an&&!e.sorti;});
  var rows=eleves.map(function(e){var d=passageDecision(e),ec=ecoleOf(e.ecoleId);
    return[e.nom,e.prenom||'',ec?ec.nom:'',e.classe,d.moy!=null?d.moy.toFixed(2):'',mentionDe(d.moy),d.decision,d.nouvelle];});
  exportCSV('passage_'+an+'.csv',['Nom','Prénom','École','Classe '+an,'Moyenne/20','Mention','Décision','Classe '+nan],rows);};
window.doPassage=function(){var an=DB.meta.annee,nan=nextAnnee(an);
  var eleves=DB.eleves.filter(function(e){return e.annee===an&&!e.sorti;});
  if(!eleves.length)return alert("Aucun élève à traiter.");
  if(!confirm("Clôturer définitivement l'année "+an+" ?\n\n"+eleves.length+" élève(s) seront archivés et passés en "+nan+".\n\nCette action est irréversible.")) return;
  var maj=[];
  eleves.forEach(function(e){var d=passageDecision(e);
    var rec={annee:an,classe:e.classe,moyenne:d.moy!=null?+d.moy.toFixed(2):null,mention:mentionDe(d.moy),decision:d.decision};
    e.histo=e.histo||[];e.histo.push(rec);
    if(d.statut==='sortie'){e.sorti=true;e.anneeSortie=an;}
    else{e.classe=d.nouvelle;e.annee=nan;}
    maj.push(e);
  });
  // persistance cloud : mise à jour des élèves (classe + année)
  Promise.all(maj.map(function(e){return sbSave('eleves',eleveRow(e));})).then(function(){
    DB.meta.annee=nan;save();
    alert("Année "+an+" clôturée. Nouvelle année : "+nan+".");
    adminTab('passage');refreshTiles();
  });};

/* Enrôlement */
window.openEnrol=function(id){
  var e=id?DB.eleves.find(function(x){return x.id===id;}):{};
  qs('#modal').innerHTML=card((id?'Modifier':'Enrôler')+' un élève',
   '<div class="grid2">'+
    f('el-nom','Nom',e.nom)+f('el-prenom','Prénom(s)',e.prenom)+
    selF('el-sexe','Sexe',[['M','Garçon'],['F','Fille']],e.sexe)+
    f('el-date','Date de naissance',e.dateN,'date')+
    f('el-lieu','Lieu de naissance',e.lieuN)+f('el-mat','Matricule / NPI',e.matricule)+
    f('el-pere','Nom du père',e.pere)+f('el-mere','Nom de la mère',e.mere)+
    f('el-tel','Téléphone parents',e.tel)+
   '</div>'+
   '<div class="field"><label>Photo</label><input type="file" id="el-photo" accept="image/*" onchange="previewPhoto(this)"><div id="el-photo-prev" style="margin-top:8px">'+(e.photo?'<img class="hub-photo" src="'+e.photo+'">':'')+'</div></div>'+
   '<button class="btn" onclick="saveEleve(\''+(id||'')+'\')">Enregistrer</button> <button class="btn ghost" onclick="closeModal()">Annuler</button>');
  window._photoData=e.photo||null;
  qs('#modal').scrollIntoView({behavior:'smooth'});
};
window.previewPhoto=function(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){window._photoData=r.result;qs('#el-photo-prev').innerHTML='<img class="hub-photo" src="'+r.result+'">';};r.readAsDataURL(f);};
window.saveEleve=function(id){var nom=val('el-nom'),prenom=val('el-prenom');if(!nom)return alert("Nom requis.");
  var rec={nom:nom,prenom:prenom,sexe:val('el-sexe'),dateN:val('el-date'),lieuN:val('el-lieu'),matricule:val('el-mat'),pere:val('el-pere'),mere:val('el-mere'),tel:val('el-tel'),photo:window._photoData||null};
  var target;
  if(id){target=DB.eleves.find(function(x){return x.id===id;});Object.assign(target,rec);}
  else{rec.id=uid('el');rec.ecoleId=SESSION.ecoleId;rec.classe=SESSION.classe;rec.annee=DB.meta.annee;DB.eleves.push(rec);target=rec;}
  sbSave('eleves',eleveRow(target)).then(function(r){if(r.error)alert("Enregistrement cloud échoué : "+r.error.message);save();closeModal();refresh();});};
window.openEnrolMasse=function(){
  qs('#modal').innerHTML=card("Coller une liste d'élèves",
   '<p class="muted" style="font-size:12.5px">Une ligne par élève. Colonnes séparées par une tabulation ou un point-virgule : <b>Nom ; Prénom ; Sexe (M/F) ; Date</b></p>'+
   '<div class="field"><textarea id="masse" rows="8" placeholder="KOFFI\tAwa\tF\t2015-03-12"></textarea></div>'+
   '<button class="btn" onclick="importMasse()">Importer</button> <button class="btn ghost" onclick="closeModal()">Annuler</button>');
  qs('#modal').scrollIntoView({behavior:'smooth'});
};
window.importMasse=function(){var t=val('masse');if(!t)return;var nouveaux=[];
  t.split(/\r?\n/).forEach(function(line){if(!line.trim())return;var c=line.split(/\t|;/).map(function(s){return s.trim();});
    if(!c[0])return;var sx=(c[2]||'').toUpperCase();sx=sx.charAt(0)==='F'?'F':'M';
    nouveaux.push({id:uid('el'),ecoleId:SESSION.ecoleId,classe:SESSION.classe,annee:DB.meta.annee,nom:c[0],prenom:c[1]||'',sexe:sx,dateN:c[3]||'',photo:null});});
  if(!nouveaux.length){closeModal();return;}
  sb.from('eleves').insert(nouveaux.map(eleveRow)).then(function(r){
    if(r.error)return alert("Import cloud échoué : "+r.error.message);
    nouveaux.forEach(function(e){DB.eleves.push(e);});save();closeModal();refresh();alert(nouveaux.length+" élève(s) importé(s).");});};
window.closeModal=function(){var m=qs('#modal');if(m)m.innerHTML='';};

function resultatEleve(ev,elId){
  var notes=(DB.notes[ev.id]||{})[elId]||{};var vals=ev.matieres.map(function(m){return notes[m];}).filter(function(x){return x!=null;});
  var moy=vals.length?vals.reduce(function(a,b){return a+b;},0)/vals.length:null;
  // rang
  var eleves=elevesDe(SESSION.ecoleId,SESSION.classe);
  var moys=eleves.map(function(el){var n=(DB.notes[ev.id]||{})[el.id]||{};var vs=ev.matieres.map(function(m){return n[m];}).filter(function(x){return x!=null;});return{id:el.id,moy:vs.length?vs.reduce(function(a,b){return a+b;},0)/vs.length:null};}).filter(function(o){return o.moy!=null;});
  moys.sort(function(a,b){return b.moy-a.moy;});
  var rang=null;moys.forEach(function(o,i){if(o.id===elId)rang=i+1;});
  return{moy:moy,rang:rang,n:moys.length};
}

function downloadFile(name,content,mime){var blob=new Blob([content],{type:(mime||'text/plain')+';charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},120);}

function toCSV(headers,rows){return '﻿'+[headers].concat(rows).map(function(r){return r.map(csvCell).join(';');}).join('\r\n');}
window.exportCSV=function(name,headers,rows){downloadFile(name,toCSV(headers,rows),'text/csv');};

  var num=(typeof v==='number')||(/^-?\d+(\.\d+)?$/.test(String(v))&&String(v).trim()!=='');

  var body=rows.map(function(r){return '<tr>'+r.map(xlsCell).join('')+'</tr>';}).join('');
  return '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'+
    '<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'+

    '<style>table{border-collapse:collapse}td,th{border:1px solid #999;padding:3px 6px;font-family:Calibri,Arial}</style></head>'+
    '<body><table>'+thead+body+'</table></body></html>';}

/* ════════════════ CONVERSION PDF → CSV / EXCEL ════════════════ */
var PDFJS_URL='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
var PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
window._convRows=null;
function renderConversion(v){
  v.innerHTML=
    card("Conversion PDF → tableau",
     '<p class="muted" style="font-size:13px">Importez un PDF contenant un tableau (liste d\'élèves, résultats…). Le texte est extrait puis converti en lignes/colonnes exportables en CSV ou Excel. <b>Nécessite une connexion Internet</b> (chargement du moteur PDF).</p>'+
     '<div class="field"><label>Fichier PDF</label><input type="file" id="conv-file" accept="application/pdf"></div>'+
     '<div class="field"><label>Séparateur de colonnes détecté</label><select id="conv-sep">'+
        '<option value="ws">Espaces multiples (2+ espaces)</option>'+
        '<option value="tab">Tabulation</option>'+
        '<option value="1">Un seul espace</option></select></div>'+
     '<button class="btn" onclick="convertPDF()">🔄 Convertir</button>'+
     '<div id="conv-msg" style="margin-top:8px;font-size:13px"></div>')+
    '<div id="conv-out"></div>';
}
function loadPdfJs(){
  return new Promise(function(res,rej){
    if(window.pdfjsLib){res(window.pdfjsLib);return;}
    var s=document.createElement('script');s.src=PDFJS_URL;
    s.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS_WORKER;}catch(e){}res(window.pdfjsLib);};
    s.onerror=function(){rej(new Error("Impossible de charger le moteur PDF (vérifiez la connexion Internet)."));};
    document.head.appendChild(s);
  });
}
window.convertPDF=function(){
  var f=(qs('#conv-file').files||[])[0];var msg=qs('#conv-msg');
  if(!f){msg.textContent="Choisissez d\'abord un fichier PDF.";return;}
  msg.textContent="Chargement du moteur PDF…";
  loadPdfJs().then(function(pdfjsLib){
    msg.textContent="Lecture du PDF…";
    var fr=new FileReader();
    fr.onload=function(){
      pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
        var pages=[];for(var i=1;i<=pdf.numPages;i++)pages.push(i);
        return Promise.all(pages.map(function(n){
          return pdf.getPage(n).then(function(pg){return pg.getTextContent().then(function(tc){
            var byLine={};
            tc.items.forEach(function(it){var y=Math.round(it.transform[5]);(byLine[y]=byLine[y]||[]).push({x:it.transform[4],s:it.str});});
            return Object.keys(byLine).sort(function(a,b){return b-a;}).map(function(y){
              return byLine[y].sort(function(a,b){return a.x-b.x;}).map(function(o){return o.s;}).join(' ').replace(/\s+/g,' ').trim();
            }).filter(function(l){return l.length;});
          });});
        }));
      }).then(function(pagesLines){
        var lines=[].concat.apply([],pagesLines);
        var sep=val('conv-sep');
        var split=sep==='tab'?/\t+/:sep==='1'?/ /:/\s{2,}/;
        var rows=lines.map(function(l){return sep==='ws'?l.split(/\s{2,}/):l.split(split);});
        var maxc=rows.reduce(function(m,r){return Math.max(m,r.length);},1);
        rows=rows.map(function(r){while(r.length<maxc)r.push('');return r;});
        window._convRows=rows;
        msg.innerHTML='<span style="color:var(--vert)">✅ '+rows.length+' ligne(s) extraite(s), '+maxc+' colonne(s).</span>';
        qs('#conv-out').innerHTML=
          '<div class="no-print" style="margin:6px 0 12px"><button class="btn gold sm" onclick="convExport(\'csv\')">⬇️ Télécharger CSV</button> <button class="btn gold sm" onclick="convExport(\'xls\')">📊 Télécharger Excel</button></div>'+
          card("Aperçu",tbl(rows[0]||[],rows.slice(1,31))+(rows.length>31?'<p class="muted" style="font-size:12px">… et '+(rows.length-31)+' ligne(s) supplémentaire(s).</p>':''));
      }).catch(function(e){msg.innerHTML='<span style="color:var(--rouge)">Erreur : '+esc(e.message||e)+'</span>';});
    };
    fr.readAsArrayBuffer(f);
  }).catch(function(e){msg.innerHTML='<span style="color:var(--rouge)">'+esc(e.message||e)+'</span>';});
};
window.convExport=function(fmt){
  var rows=window._convRows;if(!rows||!rows.length){alert("Rien à exporter.");return;}
  var headers=rows[0],body=rows.slice(1);
  if(fmt==='xls')exportXLS('conversion_'+DB.meta.annee,'Conversion',headers,body);
  else exportCSV('conversion_'+DB.meta.annee+'.csv',headers,body);
};

    loadAll().then(function(){
      var me=DB.users.find(function(u){return u.id===s.user.id;});
      if(!me){show('#screen-login');return;}
      Object.assign(SESSION,me);enterApp();
    }).catch(function(){show('#screen-login');});
  });
}
boot();
})();
</script>
